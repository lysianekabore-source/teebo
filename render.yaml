# ===================================================================
# teebo — déploiement du serveur API sur Render
#
# CORRECTIF 14/11/2026 :
#   - le contexte de build est LE DOSSIER backend/ (dossier du Dockerfile).
#     Render échouait avec « failed to calculate checksum … "/docs": not found »
#     parce que l'image recopiait un à un des fichiers de l'interface web.
#     Ce n'est plus nécessaire : le site est servi par Netlify.
#   - rootDir est fixé à backend : le service fonctionne même si, dans
#     Render, le champ « Root Directory » contient encore une ancienne valeur.
#   - db/ (migrations) est lu à la racine du dépôt : uploadez donc AUSSI le
#     dossier db/ à la racine de votre dépôt GitHub (voir LIRE-MOI).
# ===================================================================

databases:
  - name: teebo-db
    databaseName: teebo
    user: teebo
    plan: free
    region: frankfurt

services:
  - type: web
    name: teebo-api
    runtime: docker
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: frankfurt
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: "3000"
      - key: HOST
        value: 0.0.0.0
      - key: DATABASE_URL
        fromDatabase:
          name: teebo-db
          property: connectionString
      - key: CORS_ORIGIN
        value: "true"
      - key: TEEBO_ADMIN_EMAIL
        value: hello@teebo.africa
      - key: TEEBO_ADMIN_PASSWORD
        sync: false
      - key: TEEBO_WHATSAPP
        value: "+22650321432"
      - key: TEEBO_EMAIL
        value: hello@teebo.africa
      - key: PUBLIC_API_URL
        value: https://teebo-api-p825.onrender.com
      - key: PUBLIC_SITE_URL
        value: https://teebo-imf.netlify.app
      - key: DOC_LINK_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: WHATSAPP_TOKEN
        sync: false
      - key: WHATSAPP_PHONE_ID
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        value: "teebo <no-reply@teebo.africa>"
