# teebo — Blueprint Render pour l'API Matrice des habilitations
services:
  - type: web
    name: teebo-habilitations-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      # Base PostgreSQL de teebo (laisser vide si DEMO=1)
      - key: DATABASE_URL
        sync: false
      # Mode démo (1 = état en mémoire, aucune base requise)
      - key: DEMO
        value: "1"
      # Jeton super-admin teebo (côté plateforme : entitlements par IMF)
      - key: TEEBO_ADMIN_TOKEN
        sync: false
      # Jeton admin IMF (côté IMF : habilitations par utilisateur)
      - key: API_TOKEN
        sync: false
      # Origine autorisée (URL du site Netlify)
      - key: NETLIFY_ORIGIN
        sync: false
      # Production : vraie session (1 = JWT vérifié, imf_id/roles depuis la session)
      - key: USE_SESSION
        value: "0"
      # Secret de signature du JWT de session (obligatoire si USE_SESSION=1)
      - key: SESSION_JWT_SECRET
        generateValue: true
      # Durée de validité d'une session (secondes)
      - key: SESSION_TTL_SECONDS
        value: "28800"
      # Rôle plateforme teebo attendu
      - key: TEEBO_ROLE
        value: "TEEBO_ADMIN"
      # --- E-mail d'invitation (laisser SMTP_HOST vide = mode MOCK : l'e-mail
      #     est affiché dans les logs, jamais envoyé ; idéal pour tester) ---
      # URL publique du site Netlify (sert à construire le lien de connexion)
      - key: APP_BASE_URL
        sync: false
      # Expéditeur affiché
      - key: MAIL_FROM
        value: "teebo <no-reply@teebo.io>"
      # Serveur SMTP (ex. smtp.sendgrid.net, smtp.mailgun.org, smtp.gmail.com)
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        value: "587"
      # "1" pour le port 465 (TLS implicite), sinon laisser "0"
      - key: SMTP_SECURE
        value: "0"
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
