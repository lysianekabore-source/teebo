<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0b0c26">
<meta name="robots" content="noindex,nofollow">
<title>Console teebo — Approbations</title>
<link rel="icon" href="assets/favicon.ico" sizes="any">
<link rel="stylesheet" href="assets/app.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <div class="side__brand">
      <img src="assets/teebo-icon.png" width="34" height="34" alt="">
      <span>tee<b>B</b>o</span>
    </div>
    <div class="side__label">Console teebo</div>
    <button class="nav-item active" data-view="requests"><span class="ic">▤</span> Demandes</button>
    <button class="nav-item" data-view="imfs"><span class="ic">⌂</span> Institutions</button>
    <div class="side__spacer"></div>
    <div class="side__user">
      <b id="u-name">…</b>
      <small id="u-email">…</small>
      <button class="btn btn--ghost btn--sm" id="btn-logout">Déconnexion</button>
    </div>
  </aside>

  <main class="main">
    <div id="global-alert" class="alert" hidden></div>

    <section class="view" id="view-requests">
      <div class="topbar">
        <div><h1>Demandes d’accès</h1><p>Approuvez une demande pour déclencher l’essai gratuit de 30 jours et générer le code admin de l’IMF.</p></div>
        <div class="chips" id="req-chips"></div>
      </div>
      <div id="requests-table"><div class="empty">Chargement…</div></div>
    </section>

    <section class="view" id="view-imfs" hidden>
      <div class="topbar"><div><h1>Institutions</h1><p>Toutes les IMF enregistrées sur la plateforme.</p></div></div>
      <div id="imfs-table"><div class="empty">Chargement…</div></div>
    </section>
  </main>
</div>

<div id="modal-root"></div>
<script src="assets/teebo.js" defer></script>
</body>
</html>
